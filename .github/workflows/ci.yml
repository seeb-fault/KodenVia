name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kodenvia
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kodenvia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgres://kodenvia:ci-only-password@localhost:5432/kodenvia_ci
      AUTH_SECRET: ci-only-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:4000
      BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Spelling
        run: bun run check:spell
      - name: Typecheck
        run: |
          bunx next typegen
          bun run typecheck
      - name: Unit and component tests
        run: bun run test --pool=threads --maxWorkers=2
      - name: Migrate and seed temporary database
        run: |
          bun run db:migrate
          bun run db:seed
      - name: Production build
        run: bun run build
      - name: Routes and performance budgets
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start -p 4000 > /tmp/kodenvia-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "$BASE_URL" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/kodenvia-next.log; exit 1; fi
          bun run check:routes
          bun run check:vitals
      - name: Verify runner browser
        timeout-minutes: 1
        run: google-chrome --version
      - name: Browser tests against production
        timeout-minutes: 3
        run: bun run test:e2e --workers=2
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
