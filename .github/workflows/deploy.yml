name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Do not interrupt migrations or an in-flight production deployment.
concurrency:
  group: kodenvia-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.CD_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: "1"
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TESTED_SHA }}
      - name: Validate production configuration
        env:
          MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          set -euo pipefail
          for key in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN MIGRATION_URL PRODUCTION_SITE_URL; do
            if [ -z "${!key}" ]; then echo "::error::Missing production configuration: $key"; exit 1; fi
          done
          node --input-type=module -e '
            let url;
            try { url = new URL(process.env.PRODUCTION_SITE_URL); } catch {}
            if (!url || url.protocol !== "https:" || url.username || url.password) {
              throw new Error("PRODUCTION_SITE_URL must be a public HTTPS URL");
            }
          '
      - name: Require successful CI for the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" != "$TESTED_SHA" ]; then
            echo "::error::A newer main commit exists. Wait for its CI run."
            exit 1
          fi
          successful_shas=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$TESTED_SHA" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "main") | .head_sha')
          if ! grep -Fxq "$TESTED_SHA" <<< "$successful_shas"; then
            echo "::error::This commit has no successful main push CI run."
            exit 1
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0
      - name: Migrate and initialize production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          set -euo pipefail
          bun run db:migrate
          bun run db:seed
      - name: Recheck latest main and deploy with Vercel production secrets
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" != "$TESTED_SHA" ]; then
            echo "::error::A newer main commit exists. Deployment cancelled."
            exit 1
          fi
          deployment_url=$(vercel deploy --yes --prod --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$TESTED_SHA")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify public production routes
        env:
          BASE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          node --input-type=module -e '
            const request = globalThis.fetch;
            globalThis.fetch = (url, init = {}) => request(url, {
              ...init, signal: AbortSignal.timeout(20000),
            });
            await import("./scripts/check-routes.mjs");
          '
